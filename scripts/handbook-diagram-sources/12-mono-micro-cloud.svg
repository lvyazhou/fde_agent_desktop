  <text x="180.0" y="130" text-anchor="middle" font-size="16" font-weight="600" fill="#1e3a8a">单体 Monolith</text>
  <rect x="80" y="150" width="200" height="120" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="98" y="172" width="82" height="40" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="139" y="197" text-anchor="middle" font-size="12" fill="#1e40af">挂号</text>
