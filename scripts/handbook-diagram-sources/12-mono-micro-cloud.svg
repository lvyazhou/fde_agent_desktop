  <text x="239" y="251" text-anchor="middle" font-size="12" fill="#1e40af">发药</text>
  <text x="180.0" y="292" text-anchor="middle" font-size="11.5" fill="#475569">一个大程序，一起部署一起启动</text>
  <rect x="350" y="100" width="280" height="200" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" filter="url(#sh)"/>
  <text x="490.0" y="130" text-anchor="middle" font-size="16" font-weight="600" fill="#3730a3">微服务 Microservices</text>
