  <text x="554" y="193" text-anchor="middle" font-size="9.5" fill="#818cf8">独立部署</text>
  <rect x="380" y="228" width="92" height="52" rx="7" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="426" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">缴费服务</text>
  <text x="426" y="269" text-anchor="middle" font-size="9.5" fill="#818cf8">独立部署</text>
  <rect x="508" y="228" width="92" height="52" rx="7" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="554" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">发药服务</text>
  <text x="554" y="269" text-anchor="middle" font-size="9.5" fill="#818cf8">独立部署</text>
  <line x1="472" y1="178" x2="508" y2="178" stroke="#a5b4fc" stroke-width="1.3" stroke-dasharray="3,2"/>
  <line x1="426" y1="204" x2="426" y2="228" stroke="#a5b4fc" stroke-width="1.3" stroke-dasharray="3,2"/>
  <line x1="554" y1="204" x2="554" y2="228" stroke="#a5b4fc" stroke-width="1.3" stroke-dasharray="3,2"/>
  <text x="490.0" y="286" text-anchor="middle" font-size="11.5" fill="#475569">按能力拆开，接口通信，各自扩容</text>
  <rect x="660" y="100" width="280" height="200" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5" filter="url(#sh)"/>
  <text x="800.0" y="130" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">云原生 Cloud Native</text>
