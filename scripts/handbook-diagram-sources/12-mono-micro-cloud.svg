<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="ag" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 11 4, 0 8" fill="#64748b"/></marker>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="490" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#0f172a">单体 → 微服务 → 云原生：怎么切分和部署</text>
  <text x="490" y="64" text-anchor="middle" font-size="13" fill="#64748b">不是越"先进"越好——复杂度要和业务/团队规模匹配</text>
