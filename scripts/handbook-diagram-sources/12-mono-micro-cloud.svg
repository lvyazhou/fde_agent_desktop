  <rect x="711.0" y="192.0" width="22" height="16" rx="2" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.3"/>
  <line x1="711.0" y1="197.5" x2="733.0" y2="197.5" stroke="#0d9488" stroke-width="1"/>
  <line x1="722.0" y1="192.0" x2="722.0" y2="197.5" stroke="#0d9488" stroke-width="1"/>
