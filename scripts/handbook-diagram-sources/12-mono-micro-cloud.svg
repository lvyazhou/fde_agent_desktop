  <rect x="754" y="182" width="44" height="58" rx="5" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.3"/>
  <rect x="765.0" y="192.0" width="22" height="16" rx="2" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.3"/>
  <line x1="765.0" y1="197.5" x2="787.0" y2="197.5" stroke="#0d9488" stroke-width="1"/>
  <line x1="776.0" y1="192.0" x2="776.0" y2="197.5" stroke="#0d9488" stroke-width="1"/>
  <text x="776" y="229" text-anchor="middle" font-size="9" fill="#0d9488">容器</text>
  <rect x="808" y="182" width="44" height="58" rx="5" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.3"/>
  <rect x="819.0" y="192.0" width="22" height="16" rx="2" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.3"/>
  <line x1="819.0" y1="197.5" x2="841.0" y2="197.5" stroke="#0d9488" stroke-width="1"/>
  <line x1="830.0" y1="192.0" x2="830.0" y2="197.5" stroke="#0d9488" stroke-width="1"/>
  <text x="830" y="229" text-anchor="middle" font-size="9" fill="#0d9488">容器</text>
  <rect x="862" y="182" width="44" height="58" rx="5" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.3"/>
  <rect x="873.0" y="192.0" width="22" height="16" rx="2" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.3"/>
  <line x1="873.0" y1="197.5" x2="895.0" y2="197.5" stroke="#0d9488" stroke-width="1"/>
  <line x1="884.0" y1="192.0" x2="884.0" y2="197.5" stroke="#0d9488" stroke-width="1"/>
  <text x="884" y="229" text-anchor="middle" font-size="9" fill="#0d9488">容器</text>
  <text x="800.0" y="286" text-anchor="middle" font-size="11.5" fill="#475569">容器打包 + 自动调度 + 弹性伸缩</text>
  <line x1="328" y1="200.0" x2="342" y2="200.0" stroke="#64748b" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="638" y1="200.0" x2="652" y2="200.0" stroke="#64748b" stroke-width="2" marker-end="url(#ag)"/>
  <text x="490" y="322" text-anchor="middle" font-size="12.5" fill="#64748b" font-weight="600">怎么选：对着这张表和团队规模对一下</text>
  <rect x="40" y="330" width="140" height="44" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="180" y="330" width="290" height="44" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="325.0" y="357" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">单体</text>
  <rect x="470" y="330" width="290" height="44" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="615.0" y="357" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">微服务</text>
  <rect x="760" y="330" width="200" height="44" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="860.0" y="357" text-anchor="middle" font-size="13" font-weight="600" fill="#115e59">云原生</text>
  <rect x="40" y="374" width="140" height="44" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="110.0" y="401" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">好处</text>
  <rect x="180" y="374" width="290" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="190" y="401" text-anchor="start" font-size="11" font-weight="400" fill="#475569">简单、开发快，小系统够用</text>
  <rect x="470" y="374" width="290" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="401" text-anchor="start" font-size="11" font-weight="400" fill="#475569">各团队独立、按需扩容、故障隔离</text>
  <rect x="760" y="374" width="200" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="770" y="401" text-anchor="start" font-size="11" font-weight="400" fill="#475569">哪儿都能一样跑、自动伸缩、按需付费</text>
  <rect x="40" y="418" width="140" height="44" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="110.0" y="445" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">代价</text>
  <rect x="180" y="418" width="290" height="44" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="190" y="445" text-anchor="start" font-size="11" font-weight="400" fill="#475569">大了牵一发动全身、难单独扩</text>
  <rect x="470" y="418" width="290" height="44" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="445" text-anchor="start" font-size="11" font-weight="400" fill="#475569">复杂度暴涨，运维/监控成本高</text>
  <rect x="760" y="418" width="200" height="44" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="770" y="445" text-anchor="start" font-size="11" font-weight="400" fill="#475569">要懂容器/K8s，平台门槛更高</text>
  <rect x="40" y="462" width="140" height="44" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="110.0" y="489" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">何时用</text>
  <rect x="180" y="462" width="290" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="190" y="489" text-anchor="start" font-size="11" font-weight="400" fill="#475569">早期/验证期/功能不多</text>
  <rect x="470" y="462" width="290" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="480" y="489" text-anchor="start" font-size="11" font-weight="400" fill="#475569">业务大、团队多、需独立扩容</text>
  <rect x="760" y="462" width="200" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="770" y="489" text-anchor="start" font-size="11" font-weight="400" fill="#475569">要弹性、要上云(含私有云)</text>
</svg>