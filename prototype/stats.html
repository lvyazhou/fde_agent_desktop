<body class="h-screen flex flex-col m-0" x-data="statsPage">
  <nav class="top-nav px-4">
    <div class="flex items-center gap-2 mr-6">
      <div class="w-7 h-7 bg-primary rounded flex items-center justify-center"><i class="fa fa-chess-board text-white text-xs"></i></div>
      <span class="font-semibold text-[15px] text-[#333]">智弈五子棋</span>
    </div>
    <a href="index.html" class="top-nav-item"><i class="fa fa-home"></i>首页</a>
    <a href="play.html" class="top-nav-item"><i class="fa fa-gamepad"></i>对局</a>
    <a href="stats.html" class="top-nav-item active"><i class="fa fa-chart-bar"></i>统计</a>
    <div class="ml-auto flex items-center gap-4 text-[12px] text-[#999]">
      <span>总局数: <b class="text-[#333]" x-text="FC.total_games">-</b></span>
      <span>胜率: <b class="text-[#059669]" x-text="FC.win_rate">-</b></span>
      <div class="w-8 h-8 rounded-full bg-primary-light flex items-center justify-center"><i class="fa fa-user text-primary text-xs"></i></div>
    </div>
  </nav>

  <div class="flex flex-1 overflow-hidden">
    <aside class="side-rail">
      <a href="index.html" class="rail-item"><i class="fa fa-home"></i>首页</a>
      <a href="play.html" class="rail-item"><i class="fa fa-gamepad"></i>对局</a>
      <a href="stats.html" class="rail-item active"><i class="fa fa-chart-bar"></i>统计</a>
      <div class="rail-item opacity-40"><i class="fa fa-brain"></i>AI分析</div>
    </aside>

    <main class="main-content">
      <div class="page-tabs mb-0">
        <div class="page-tab" :class="{active:activeTab==='overview'}" @click="switchTab('overview')">📊 整体统计</div>
        <div class="page-tab" :class="{active:activeTab==='records'}" @click="switchTab('records')">📋 对局记录</div>
      </div>

      <!-- 整体统计 Tab -->
      <div x-show="activeTab==='overview'" class="space-y-4 pt-4">
        <section class="bg-gradient-to-r from-[#eff6ff] to-white border border-[#bfdbfe] rounded-lg px-4 py-2.5 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-md bg-primary text-white flex items-center justify-center"><i class="fa fa-chart-pie text-[14px]"></i></div>
            <div><div class="text-sm font-semibold text-[#1e3a8a]">整体统计</div><div class="text-[11.5px] text-[#1e40af]">全量对局数据汇总 · 多维度分析</div></div>
          </div>
          <div class="text-[12px] text-[#1e40af]">胜率 <span class="text-[15px] font-semibold" x-text="FC.win_rate">-</span></div>
        </section>

        <div class="grid grid-cols-6 gap-3">
          <template x-for="kpi in kpis" :key="kpi.key">
            <div class="bg-white rounded-lg border border-[#e8ecf0] p-4 kpi-card" @click="showToast(kpi.label+' 详情')">
              <div class="flex items-center justify-between"><span class="text-[#999] text-[13px]" x-text="kpi.label"></span><i :class="'fa fa-'+kpi.icon+' text-primary'"></i></div>
              <div class="flex items-baseline gap-2 mt-1"><span class="text-xl font-semibold text-[#333]" x-text="kpi.value"></span><span class="text-[11px]" :class="kpi.delta>=0?'text-emerald-600':'text-red-500'" x-text="(kpi.delta>=0?'↑':'↓')+Math.abs(kpi.delta)+'%'"></span></div>
            </div>
          </template>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="chart-box"><div class="text-sm font-medium text-[#333] mb-1">📈 胜率趋势</div><div id="chartWinTrend" style="height:260px"></div></div>
          <div class="chart-box"><div class="text-sm font-medium text-[#333] mb-1">🎯 难度胜率对比</div><div id="chartDiff" style="height:260px"></div></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="chart-box"><div class="text-sm font-medium text-[#333] mb-1">📅 每周对局数</div><div id="chartWeekly" style="height:260px"></div></div>
          <div class="chart-box"><div class="text-sm font-medium text-[#333] mb-1">📐 棋盘尺寸分布</div><div id="chartBoard" style="height:260px"></div></div>
        </div>
      </div>

      <!-- 对局记录 Tab -->
      <div x-show="activeTab==='records'" class="space-y-4 pt-4">
        <div class="flex items-center gap-3 bg-white rounded-lg border border-[#e8ecf0] p-3">
          <input type="text" placeholder="🔍 搜索..." class="border border-[#e8ecf0] rounded px-3 py-1.5 text-sm w-48 outline-none focus:border-primary" x-model="searchText">
          <select class="border border-[#e8ecf0] rounded px-3 py-1.5 text-sm outline-none" x-model="filterDiff" @change="page=1">
            <option value="">全部难度</option><option value="初级">初级</option><option value="中级">中级</option><option value="高级">高级</option>
          </select>
          <select class="border border-[#e8ecf0] rounded px-3 py-1.5 text-sm outline-none" x-model="filterResult" @change="page=1">
            <option value="">全部结果</option><option value="win">胜利</option><option value="loss">失败</option><option value="draw">平局</option>
          </select>
        </div>
        <div class="bg-white rounded-lg border border-[#e8ecf0] overflow-hidden">
          <table class="w-full text-sm">
            <thead class="bg-[#f5f7fa] border-b border-[#e8ecf0]">
              <tr>
                <th class="px-4 py-2.5 text-left text-[#666] font-normal">#</th>
                <th class="px-4 py-2.5 text-left text-[#666] font-normal">日期</th>
                <th class="px-4 py-2.5 text-left text-[#666] font-normal">结果</th>
                <th class="px-4 py-2.5 text-left text-[#666] font-normal">难度</th>
                <th class="px-4 py-2.5 text-left text-[#666] font-normal">棋盘</th>
                <th class="px-4 py-2.5 text-left text-[#666] font-normal">步数</th>
                <th class="px-4 py-2.5 text-left text-[#666] font-normal">用时</th>
                <th class="px-4 py-2.5 text-left text-[#666] font-normal">先手</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(r,i) in pagedRecords" :key="r.id">
                <tr class="border-b border-[#e8ecf0] table-row cursor-pointer" @click="detail=r;drawerOpen=true">
                  <td class="px-4 py-2.5 text-[#999]" x-text="(page-1)*pageSize+i+1"></td>
                  <td class="px-4 py-2.5 text-[#333]" x-text="r.date"></td>
                  <td class="px-4 py-2.5"><span class="px-2 py-0.5 rounded text-xs" :class="r.result==='win'?'bg-emerald-50 text-[#059669]':r.result==='loss'?'bg-red-50 text-[#dc2626]':'bg-amber-50 text-[#d97706]'" x-text="r.result==='win'?'胜利':r.result==='loss'?'失败':'平局'"></span></td>
                  <td class="px-4 py-2.5 text-[#333]" x-text="r.difficulty"></td>
                  <td class="px-4 py-2.5 text-[#999]" x-text="r.board_size+'×'+r.board_size"></td>
                  <td class="px-4 py-2.5 text-[#333]" x-text="r.moves+'手'"></td>
                  <td class="px-4 py-2.5 text-[#999]" x-text="Math.floor(r.duration/60)+'分'+(r.duration%60)+'秒'"></td>
                  <td class="px-4 py-2.5 text-[#999]" x-text="r.first_move"></td>
                </tr>
              </template>
            </tbody>
          </table>
          <div class="flex items-center justify-between px-4 py-3 border-t border-[#e8ecf0] text-sm text-[#666]">
            <span>共 <b class="text-[#333]" x-text="filteredRecords.length">0</b> 条，第 <b class="text-[#333]" x-text="page"></b>/<b class="text-[#333]" x-text="totalPages">1</b> 页</span>
            <div class="flex gap-2">
              <button class="px-3 py-1 border rounded text-xs hover:bg-gray-50 disabled:opacity-30" :disabled="page<=1" @click="page--">上一页</button>
              <button class="px-3 py-1 border rounded text-xs hover:bg-gray-50 disabled:opacity-30" :disabled="page>=totalPages" @click="page++">下一页</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 详情抽屉 -->
  <div x-show="drawerOpen" x-transition.opacity class="fixed inset-0 z-50">
    <div class="absolute inset-0 bg-black/40" @click="drawerOpen=false"></div>
    <aside class="absolute right-0 top-0 bottom-0 w-[420px] bg-white shadow-xl overflow-y-auto" x-transition:enter="transition transform" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0">
      <header class="h-12 px-5 flex items-center border-b border-[#e8ecf0] sticky top-0 bg-white z-10">
        <span class="text-sm font-medium">对局详情 #<span x-text="detail?.id"></span></span>
        <button class="ml-auto" @click="drawerOpen=false"><i class="fa fa-times text-gray-400"></i></button>
      </header>
      <div class="p-5 space-y-4" x-show="detail">
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-[#f5f7fa] rounded p-3"><div class="text-[11px] text-[#999]">日期</div><div class="text-sm font-medium text-[#333]" x-text="detail?.date"></div></div>
          <div class="bg-[#f5f7fa] rounded p-3"><div class="text-[11px] text-[#999]">结果</div><div class="text-sm font-medium" :class="detail?.result==='win'?'text-[#059669]':detail?.result==='loss'?'text-[#dc2626]':'text-[#d97706]'" x-text="detail?.result==='win'?'胜利':detail?.result==='loss'?'失败':'平局'"></div></div>
          <div class="bg-[#f5f7fa] rounded p-3"><div class="text-[11px] text-[#999]">AI难度</div><div class="text-sm font-medium text-[#333]" x-text="detail?.difficulty"></div></div>
          <div class="bg-[#f5f7fa] rounded p-3"><div class="text-[11px] text-[#999]">棋盘尺寸</div><div class="text-sm font-medium text-[#333]" x-text="detail?.board_size+'×'+detail?.board_size"></div></div>
          <div class="bg-[#f5f7fa] rounded p-3"><div class="text-[11px] text-[#999]">步数</div><div class="text-sm font-medium text-[#333]" x-text="detail?.moves+'手'"></div></div>
          <div class="bg-[#f5f7fa] rounded p-3"><div class="text-[11px] text-[#999]">用时</div><div class="text-sm font-medium text-[#333]" x-text="detail?.duration?Math.floor(detail.duration/60)+'分'+(detail.duration%60)+'秒':'-'"></div></div>
        </div>
      </div>
    </aside>
  </div>

  <template x-for="t in toasts" :key="t.id">
    <div class="toast px-4 py-2.5 rounded-lg shadow-lg bg-white border text-sm fixed top-16 right-5 z-50" :class="t.type==='success'?'border-emerald-300 text-emerald-700':'border-blue-200 text-blue-700'" x-show="!t.removing" x-transition.opacity.duration.300ms x-text="t.message"></div>
  </template>

  <script>
  document.addEventListener('alpine:init',()=>{
    Alpine.data('statsPage',()=>({
      activeTab:'overview',
      stats:{},history:[],statsLoaded:false,
      page:1,pageSize:15,searchText:'',filterDiff:'',filterResult:'',
      detail:null,drawerOpen:false,
      toasts:[],_tid:0,
      get FC(){
        const s=this.stats;
        const totalW=s.win_rate||0;
        return {
          total_games:TC_FMT.thousands(s.total_games||0),
          wins:TC_FMT.thousands(s.wins||0),
          losses:TC_FMT.thousands(s.losses||0),
          win_rate:TC_FMT.pct(totalW,1),
          streak:TC_FMT.thousands(s.current_streak||0)+'局',
          avg_moves:TC_FMT.thousands(s.avg_moves||0)+'手',
        };
      },
      get kpis(){return[
        {key:'total',label:'总局数',value:this.FC.total_games,delta:12,icon:'chess-board'},
        {key:'wins',label:'胜场',value:this.FC.wins,delta:8,icon:'trophy'},
        {key:'losses',label:'败场',value:this.FC.losses,delta:-3,icon:'frown'},
        {key:'rate',label:'胜率',value:this.FC.win_rate,delta:5,icon:'bullseye'},
        {key:'streak',label:'连胜纪录',value:this.FC.streak,delta:15,icon:'fire'},
        {key:'moves',label:'平均步数',value:this.FC.avg_moves,delta:-2,icon:'shoe-prints'},
      ]},
      get filteredRecords(){
        return this.history.filter(r=>{
          if(this.searchText&&!r.date.includes(this.searchText)&&!r.first_move.toLowerCase().includes(this.searchText.toLowerCase()))return false;
          if(this.filterDiff&&!r.difficulty.includes(this.filterDiff))return false;
          if(this.filterResult&&r.result!==this.filterResult)return false;
          return true;
        });
      },
      get totalPages(){return Math.max(1,Math.ceil(this.filteredRecords.length/this.pageSize))},
      get pagedRecords(){
        const start=(this.page-1)*this.pageSize;
        return this.filteredRecords.slice(start,start+this.pageSize);
      },
      async init(){
        try{
          const[sr,hr]=await Promise.all([fetch('data/stats.json'),fetch('data/history.json')]);
          this.stats=await sr.json();
          this.history=await hr.json();
          this.statsLoaded=true;
          this.$nextTick(()=>{
            if(this.activeTab==='overview'){this.renderCharts()}
          });
        }catch(e){console.error('数据加载失败',e)}
      },
      switchTab(tab){
        this.activeTab=tab;
        if(tab==='overview')this.$nextTick(()=>this.renderCharts());
      },
      showToast(msg,type='info'){
        const id=++this._tid;
        this.toasts.push({id,message:msg,type,removing:false});
        setTimeout(()=>{const t=this.toasts.find(x=>x.id===id);if(t)t.removing=true;setTimeout(()=>{this.toasts=this.toasts.filter(x=>x.id!==id)},300)},2500);
      },
      renderCharts(){
        ['chartWinTrend','chartDiff','chartWeekly','chartBoard'].forEach(id=>{
          const dom=document.getElementById(id);
          if(dom)dom.innerHTML='';
        });
        this._renderWinTrend();
        this._renderDiff();
        this._renderWeekly();
        this._renderBoard();
      },
      _chart(id){
        const dom=document.getElementById(id);
        if(!dom||!dom.parentElement||dom.parentElement.offsetParent===null)return null;
        return echarts.init(dom);
      },
      _renderWinTrend(){
        const c=this._chart('chartWinTrend');if(!c)return;
        const d=this.stats.win_rate_trend||[];
        c.setOption({
          tooltip:TC_ECHARTS.tooltip({formatter:p=>p[0].axisValue+'<br/>胜率: <b>'+(p[0].value*100).toFixed(1)+'%</b>'}),
          grid:TC_ECHARTS.grid({top:16}),
          xAxis:{type:'category',data:d.map(x=>x.period),...TC_ECHARTS.axis()},
          yAxis:{type:'value',min:0.3,max:0.8,axisLabel:{color:'#666',fontSize:11,formatter:v=>(v*100).toFixed(0)+'%'},splitLine:{lineStyle:{color:'#f0f2f5',type:'dashed'}}},
          series:[{type:'line',data:d.map(x=>x.rate),smooth:true,symbol:'circle',symbolSize:6,lineStyle:{color:'#2563eb',width:2},itemStyle:{color:'#2563eb'},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(37,99,235,0.15)'},{offset:1,color:'rgba(37,99,235,0.02)'}]}}}]
        });c.resize();
      },
      _renderDiff(){
        const c=this._chart('chartDiff');if(!c)return;
        const d=this.stats.difficulty_trend||[];
        c.setOption({
          tooltip:TC_ECHARTS.tooltip(),grid:TC_ECHARTS.grid({top:16}),legend:TC_ECHARTS.legend(),
          xAxis:{type:'category',data:d.map(x=>x.period),...TC_ECHARTS.axis()},
          yAxis:{type:'value',min:0,max:1,axisLabel:{color:'#666',fontSize:11,formatter:v=>(v*100).toFixed(0)+'%'},splitLine:{lineStyle:{color:'#f0f2f5',type:'dashed'}}},
          series:[
            {name:'初级',type:'line',data:d.map(x=>x.easy),smooth:true,symbol:'circle',symbolSize:4,lineStyle:{color:'#059669',width:2},itemStyle:{color:'#059669'}},
            {name:'中级',type:'line',data:d.map(x=>x.medium),smooth:true,symbol:'circle',symbolSize:4,lineStyle:{color:'#2563eb',width:2},itemStyle:{color:'#2563eb'}},
            {name:'高级',type:'line',data:d.map(x=>x.hard),smooth:true,symbol:'circle',symbolSize:4,lineStyle:{color:'#d97706',width:2},itemStyle:{color:'#d97706'}}
          ]
        });c.resize();
      },
      _renderWeekly(){
        const c=this._chart('chartWeekly');if(!c)return;
        const d=this.stats.weekly||[];
        c.setOption({
          tooltip:TC_ECHARTS.tooltip({formatter:p=>p[0].name+'<br/>对局: <b>'+p[0].value+'</b> 场<br/>胜场: <b>'+d[p[0].dataIndex].wins+'</b>'}),
          grid:TC_ECHARTS.grid({top:16}),
          xAxis:{type:'category',data:d.map(x=>x.date),...TC_ECHARTS.axis()},
          yAxis:{type:'value',...TC_ECHARTS.axis()},
          series:[{type:'bar',data:d.map(x=>x.games),barWidth:24,itemStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'#60a5fa'},{offset:1,color:'#2563eb'}]}},borderRadius:[4,4,0,0]}]
        });c.resize();
      },
      _renderBoard(){
        const c=this._chart('chartBoard');if(!c)return;
        const bs=this.stats.by_board_size||{};
        const data=[{name:'9×9 快棋',value:bs['9']?.games||0},{name:'13×13 标准',value:bs['13']?.games||0},{name:'15×15 经典',value:bs['15']?.games||0}];
        c.setOption({
          tooltip:{trigger:'item',backgroundColor:'#fff',borderColor:'#e8ecf0',textStyle:{color:'#333',fontSize:12},formatter:'{b}: {c} 场 ({d}%)'},
          series:[{type:'pie',radius:['55%','78%'],center:['50%','52%'],avoidLabelOverlap:false,label:{show:true,formatter:'{b}\n{d}%',fontSize:11,color:'#666'},emphasis:{label:{fontSize:14,fontWeight:'bold'}},data,itemStyle:{color:p=>['#2563eb','#60a5fa','#93c5fd'][p.dataIndex]}}]
        });c.resize();
      }
    }));
  });
  </script>
</body>
</html>
