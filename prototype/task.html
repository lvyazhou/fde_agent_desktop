<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务管理 - 项目需求管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f7fa; }
    .top-nav { background:#fff; height:48px; border-bottom:1px solid #e8ecf0; display:flex; align-items:center; flex-shrink:0; position:sticky; top:0; z-index:30; }
    .top-nav-item { color:#666; font-size:14px; padding:0 20px; height:48px; display:flex; align-items:center; gap:6px; white-space:nowrap; text-decoration:none; }
    .top-nav-item:hover { color:#2563eb; }
    .top-nav-item.active { color:#2563eb; font-weight:500; border-bottom:2px solid #2563eb; }
    .side-rail { width:72px; background:#fff; border-right:1px solid #e8ecf0; display:flex; flex-direction:column; padding:8px 0; gap:4px; position:sticky; top:48px; height:calc(100vh - 48px); }
    .rail-item { width:56px; height:56px; margin:0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:6px; color:#666; cursor:pointer; transition:all .15s; }
    .rail-item:hover { background:#eff6ff; color:#2563eb; }
    .rail-item.active { background:#eff6ff; color:#2563eb; }
    .rail-item i { font-size:18px; }
    .rail-item span { font-size:10px; margin-top:2px; }
    .rail-item a { color:inherit; display:flex; flex-direction:column; align-items:center; justify-content:center; width:56px; height:56px; text-decoration:none; }
  </style>
</head>
<body x-data="taskMgmt()" x-init="init()">
  <nav class="top-nav">
    <div class="flex items-center gap-3 px-4 border-r border-[#e8ecf0] h-full">
      <div class="w-8 h-8 bg-[#2563eb] rounded-lg flex items-center justify-center"><i class="fa fa-project-diagram text-white text-sm"></i></div>
      <span class="font-semibold text-[#1e3a8a] text-sm">项目需求管理系统</span>
    </div>
    <a href="index.html" class="top-nav-item"><i class="fa fa-home"></i><span>工作台</span></a>
    <a href="project-list.html" class="top-nav-item"><i class="fa fa-folder-open"></i><span>项目管理</span></a>
    <a href="gantt.html" class="top-nav-item"><i class="fa fa-chart-gantt"></i><span>甘特图</span></a>
    <a href="requirement.html" class="top-nav-item"><i class="fa fa-list-check"></i><span>需求管理</span></a>
    <a href="task.html" class="top-nav-item active"><i class="fa fa-tasks"></i><span>任务管理</span></a>
    <a href="ai-assistant.html" class="top-nav-item"><i class="fa fa-robot"></i><span>AI助手</span></a>
    <a href="reports.html" class="top-nav-item"><i class="fa fa-chart-bar"></i><span>报表</span></a>
    <div class="ml-auto flex items-center gap-3 px-4">
      <button class="relative text-[#999] hover:text-[#2563eb]"><i class="fa fa-bell text-lg"></i></button>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-[#2563eb] rounded-full flex items-center justify-center text-white text-sm font-medium">PM</div>
        <span class="text-sm text-[#475569]">张明华</span>
      </div>
    </div>
  </nav>

  <div class="flex">
    <div class="side-rail">
      <div class="rail-item"><a href="index.html"><i class="fa fa-home"></i><span>工作台</span></a></div>
      <div class="rail-item"><a href="project-list.html"><i class="fa fa-folder-open"></i><span>项目</span></a></div>
      <div class="rail-item"><a href="gantt.html"><i class="fa fa-chart-gantt"></i><span>甘特图</span></a></div>
      <div class="rail-item"><a href="requirement.html"><i class="fa fa-list-check"></i><span>需求</span></a></div>
      <div class="rail-item active"><i class="fa fa-tasks"></i><span>任务</span></div>
      <div class="rail-item"><a href="ai-assistant.html"><i class="fa fa-robot"></i><span>AI助手</span></a></div>
      <div class="rail-item"><a href="reports.html"><i class="fa fa-chart-bar"></i><span>报表</span></a></div>
      <div class="rail-item"><a href="settings.html"><i class="fa fa-cog"></i><span>设置</span></a></div>
    </div>

    <!-- Main -->
    <div class="flex-1 overflow-auto p-6">
      <!-- My Task Summary -->
      <div class="mb-5 grid grid-cols-4 gap-4">
        <div class="bg-white rounded-lg border border-[#e8ecf0] p-4 text-center cursor-pointer hover:shadow-sm transition" @click="filter.status='';tab='all'">
          <div class="text-2xl font-bold text-[#1e3a8a]" x-text="tasks.length">0</div>
          <div class="text-[11px] text-[#999] mt-1">任务总数</div>
        </div>
        <div class="bg-white rounded-lg border border-[#e8ecf0] p-4 text-center cursor-pointer hover:shadow-sm transition" @click="filter.status='in_progress';tab='all'">
          <div class="text-2xl font-bold text-blue-600" x-text="tasks.filter(t=>t.status==='in_progress').length">0</div>
          <div class="text-[11px] text-[#999] mt-1">进行中</div>
        </div>
        <div class="bg-white rounded-lg border border-[#e8ecf0] p-4 text-center cursor-pointer hover:shadow-sm transition" @click="filter.status='completed';tab='all'">
          <div class="text-2xl font-bold text-green-600" x-text="tasks.filter(t=>t.status==='completed').length">0</div>
          <div class="text-[11px] text-[#999] mt-1">已完成</div>
        </div>
        <div class="bg-white rounded-lg border border-[#e8ecf0] p-4 text-center cursor-pointer hover:shadow-sm transition" @click="filter.status='overdue';tab='all'">
          <div class="text-2xl font-bold text-red-500" x-text="tasks.filter(t=>t.status==='overdue'||(t.status!=='completed'&&new Date(t.end)<new Date('2025-06-25'))).length">0</div>
          <div class="text-[11px] text-[#999] mt-1">已延误</div>
        </div>
      </div>

      <!-- Tab Bar -->
      <div class="bg-white rounded-lg border border-[#e8ecf0] mb-4">
        <div class="flex border-b border-[#e8ecf0]">
          <button @click="tab='all';filter.status=''" class="px-5 py-3 text-sm border-b-2 transition" :class="tab==='all'?'border-[#2563eb] text-[#2563eb] font-medium':'border-transparent text-[#666]'">全部任务</button>
          <button @click="tab='mine';filter.assignee='张工'" class="px-5 py-3 text-sm border-b-2 transition" :class="tab==='mine'?'border-[#2563eb] text-[#2563eb] font-medium':'border-transparent text-[#666]'">我的任务</button>
          <button @click="tab='today'" class="px-5 py-3 text-sm border-b-2 transition" :class="tab==='today'?'border-[#2563eb] text-[#2563eb] font-medium':'border-transparent text-[#666]'">
            <i class="fa fa-clock text-amber-500 mr-1"></i>今日待办
            <span class="ml-1 bg-red-50 text-red-500 text-[10px] px-1.5 rounded-full" x-text="todayTasks.length"></span>
          </button>
          <div class="ml-auto flex items-center px-4">
            <button @click="showCreate=true" class="px-3 py-1.5 bg-[#2563eb] hover:bg-[#1d4ed8] text-white rounded text-sm transition"><i class="fa fa-plus mr-1"></i>新建任务</button>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="px-4 py-3 flex items-center gap-3 flex-wrap">
          <select x-model="filter.project" @change="tab='all'" class="text-sm border border-[#e8ecf0] rounded px-3 py-1.5 focus:outline-none focus:border-[#2563eb]">
            <option value="">全部项目</option>
            <template x-for="p in projects" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
          </select>
          <select x-model="filter.priority" class="text-sm border border-[#e8ecf0] rounded px-3 py-1.5 focus:outline-none focus:border-[#2563eb]">
            <option value="">全部优先级</option>
            <option value="P0">P0</option><option value="P1">P1</option><option value="P2">P2</option>
          </select>
          <select x-model="filter.assignee" class="text-sm border border-[#e8ecf0] rounded px-3 py-1.5 focus:outline-none focus:border-[#2563eb]">
            <option value="">全部负责人</option>
            <option value="张工">张工</option><option value="李工">李工</option><option value="王工">王工</option><option value="赵工">赵工</option><option value="刘工">刘工</option>
          </select>
          <input x-model="filter.keyword" type="text" placeholder="搜索任务..." class="flex-1 text-sm border border-[#e8ecf0] rounded px-3 py-1.5 focus:outline-none focus:border-[#2563eb]">
          <button @click="filter={project:'',priority:'',assignee:'',keyword:'',status:''};tab='all'" class="text-[#999] hover:text-[#2563eb] text-sm">重置</button>
        </div>

        <!-- Task List -->
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead>
              <tr class="bg-[#f5f7fa] border-b border-[#e8ecf0]">
                <th class="text-left px-4 py-2.5 text-[11px] font-medium text-[#999] uppercase tracking-wide w-8"><input type="checkbox" class="rounded"></th>
                <th class="text-left px-4 py-2.5 text-[11px] font-medium text-[#999] uppercase tracking-wide">任务</th>
                <th class="text-left px-4 py-2.5 text-[11px] font-medium text-[#999] uppercase tracking-wide">关联需求</th>
                <th class="text-left px-4 py-2.5 text-[11px] font-medium text-[#999] uppercase tracking-wide">优先级</th>
                <th class="text-left px-4 py-2.5 text-[11px] font-medium text-[#999] uppercase tracking-wide">负责人</th>
                <th class="text-left px-4 py-2.5 text-[11px] font-medium text-[#999] uppercase tracking-wide">计划时间</th>
                <th class="text-left px-4 py-2.5 text-[11px] font-medium text-[#999] uppercase tracking-wide">工时</th>
                <th class="text-left px-4 py-2.5 text-[11px] font-medium text-[#999] uppercase tracking-wide">状态</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="t in filtered" :key="t.id">
                <tr class="border-t border-[#e8ecf0] hover:bg-[#f5f7fa] transition">
                  <td class="px-4 py-3"><input type="checkbox" class="rounded border-[#e8ecf0]" @click.stop></td>
                  <td class="px-4 py-3 cursor-pointer" @click="viewDetail(t)">
                    <div class="text-sm font-medium text-[#333]" x-text="t.title"></div>
                    <div class="text-[11px] text-[#999]" x-text="t.id"></div>
                  </td>
                  <td class="px-4 py-3 text-sm text-[#2563eb]" x-text="t.requirement"></td>
                  <td class="px-4 py-3">
                    <span class="text-[11px] px-1.5 py-0.5 rounded" :class="t.priority==='P0'?'bg-red-50 text-red-500':t.priority==='P1'?'bg-amber-50 text-amber-500':'bg-gray-50 text-gray-400'" x-text="t.priority"></span>
                  </td>
                  <td class="px-4 py-3 text-sm text-[#475569]" x-text="t.assignee"></td>
                  <td class="px-4 py-3 text-sm text-[#475569]" x-text="t.start+' ~ '+t.end"></td>
                  <td class="px-4 py-3 text-sm text-[#475569]" x-text="t.estimate+'d / '+t.actual+'d'"></td>
                  <td class="px-4 py-3">
                    <button @click.stop="toggleStatus(t)" class="text-[11px] px-2 py-0.5 rounded-full border transition"
                            :class="t.status==='completed'?'bg-green-50 border-green-200 text-green-600 hover:bg-green-100':'bg-blue-50 border-blue-200 text-blue-600 hover:bg-blue-100'"
                            x-text="t.status==='completed'?'已完成':'进行中'">
                    </button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <div x-show="filtered.length===0" class="text-center py-12 text-[#999]">
            <i class="fa fa-check-double text-4xl mb-3"></i>
            <p class="text-sm">没有找到匹配的任务</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Task Detail Drawer -->
  <div x-show="selectedTask" x-transition.opacity class="fixed inset-0 z-50">
    <div class="absolute inset-0 bg-black/40" @click="selectedTask=null"></div>
    <aside class="absolute right-0 top-0 bottom-0 w-[480px] bg-white shadow-xl overflow-y-auto"
           x-transition:enter="transition transform" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0">
      <header class="h-12 px-5 flex items-center border-b border-[#e8ecf0] sticky top-0 bg-white z-10">
        <span class="text-sm font-semibold text-[#1e3a8a]">任务详情</span>
        <button @click="selectedTask=null" class="ml-auto text-gray-400 hover:text-gray-600"><i class="fa fa-times"></i></button>
      </header>
      <div class="p-5" x-show="selectedTask">
        <div class="text-sm font-semibold text-[#1e3a8a] mb-1" x-text="selectedTask.title"></div>
        <div class="text-[11px] text-[#999] mb-4" x-text="selectedTask.id"></div>
        <div class="grid grid-cols-2 gap-3 mb-4">
          <div class="bg-[#f5f7fa] rounded-lg p-3"><div class="text-[11px] text-[#999] mb-1">负责人</div><div class="text-sm text-[#333]" x-text="selectedTask.assignee"></div></div>
          <div class="bg-[#f5f7fa] rounded-lg p-3"><div class="text-[11px] text-[#999] mb-1">优先级</div><span class="text-sm font-semibold" :class="selectedTask.priority==='P0'?'text-red-500':selectedTask.priority==='P1'?'text-amber-500':'text-[#475569]'" x-text="selectedTask.priority"></span></div>
          <div class="bg-[#f5f7fa] rounded-lg p-3"><div class="text-[11px] text-[#999] mb-1">计划时间</div><div class="text-sm text-[#333]" x-text="selectedTask.start+' 至 '+selectedTask.end"></div></div>
          <div class="bg-[#f5f7fa] rounded-lg p-3"><div class="text-[11px] text-[#999] mb-1">工时</div><div class="text-sm text-[#333]" x-text="selectedTask.estimate+'人天 / '+selectedTask.actual+'人天'"></div></div>
        </div>
        <div class="border-t border-[#e8ecf0] pt-4 mt-4 flex gap-3">
          <button @click="toggleStatus(selectedTask)" class="flex-1 py-2.5 rounded-lg text-sm font-medium transition" :class="selectedTask.status==='completed'?'bg-gray-100 text-gray-500':'bg-[#2563eb] hover:bg-[#1d4ed8] text-white'" x-text="selectedTask.status==='completed'?'标记未完成':'标记完成'"></button>
          <button class="px-4 py-2.5 border border-[#e8ecf0] rounded-lg text-sm text-[#475569] hover:bg-[#f5f7fa] transition"><i class="fa fa-edit mr-1"></i>编辑</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- Create Task Drawer -->
  <div x-show="showCreate" x-transition.opacity class="fixed inset-0 z-50">
    <div class="absolute inset-0 bg-black/40" @click="showCreate=false"></div>
    <aside class="absolute right-0 top-0 bottom-0 w-[480px] bg-white shadow-xl overflow-y-auto"
           x-transition:enter="transition transform" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0">
      <header class="h-12 px-5 flex items-center border-b border-[#e8ecf0] sticky top-0 bg-white z-10">
        <span class="text-sm font-semibold text-[#1e3a8a]">新建任务</span>
        <button @click="showCreate=false" class="ml-auto text-gray-400 hover:text-gray-600"><i class="fa fa-times"></i></button>
      </header>
      <div class="p-5 space-y-4">
        <div>
          <label class="block text-sm font-medium text-[#475569] mb-1.5">任务名称 <span class="text-red-500">*</span></label>
          <input x-model="newTask.title" type="text" placeholder="请输入任务名称" class="w-full border border-[#e8ecf0] rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2563eb]">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-sm font-medium text-[#475569] mb-1.5">关联需求</label><select x-model="newTask.requirement" class="w-full border border-[#e8ecf0] rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2563eb]"><option value="">请选择</option><template x-for="r in requirements" :key="r.id"><option :value="r.id" x-text="r.id+' - '+r.title.slice(0,15)"></option></template></select></div>
          <div><label class="block text-sm font-medium text-[#475569] mb-1.5">负责人</label><select x-model="newTask.assignee" class="w-full border border-[#e8ecf0] rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2563eb]"><option value="张工">张工</option><option value="李工">李工</option><option value="王工">王工</option><option value="赵工">赵工</option><option value="刘工">刘工</option></select></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-sm font-medium text-[#475569] mb-1.5">开始日期</label><input x-model="newTask.start" type="date" class="w-full border border-[#e8ecf0] rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2563eb]"></div>
          <div><label class="block text-sm font-medium text-[#475569] mb-1.5">结束日期</label><input x-model="newTask.end" type="date" class="w-full border border-[#e8ecf0] rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2563eb]"></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-sm font-medium text-[#475569] mb-1.5">预估工时(人天)</label><input x-model="newTask.estimate" type="number" placeholder="0" class="w-full border border-[#e8ecf0] rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2563eb]"></div>
          <div><label class="block text-sm font-medium text-[#475569] mb-1.5">优先级</label><select x-model="newTask.priority" class="w-full border border-[#e8ecf0] rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#2563eb]"><option value="P0">P0</option><option value="P1">P1</option><option value="P2">P2</option></select></div>
        </div>
        <div class="pt-4 border-t border-[#e8ecf0] flex gap-3">
          <button @click="createTask()" class="flex-1 py-2.5 bg-[#2563eb] hover:bg-[#1d4ed8] text-white rounded-lg text-sm font-medium transition">确认创建</button>
          <button @click="showCreate=false" class="px-6 py-2.5 border border-[#e8ecf0] rounded-lg text-sm text-[#475569] hover:bg-[#f5f7fa] transition">取消</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- Toast -->
  <div class="fixed top-14 right-4 z-50 space-y-2">
    <template x-for="t in toasts" :key="t.id">
      <div x-show="!t.removing" x-transition class="bg-[#1e3a8a] text-white text-sm px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 min-w-[200px]">
        <i class="fa fa-check-circle text-green-400"></i><span x-text="t.msg"></span>
      </div>
    </template>
  </div>

  <script src="js/charts.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.0/dist/cdn.min.js"></script>
  <script>
    function taskMgmt() {
      return {
        tasks: [], projects: [], requirements: [], tab: 'all', showCreate: false, selectedTask: null,
        filter: { project:'', priority:'', assignee:'', keyword:'', status:'' },
        newTask: { title:'', requirement:'', assignee:'张工', start:'', end:'', estimate:0, priority:'P1', project:'P001', status:'pending', actual:0 },
        toasts: [], _tid: 0,
        get filtered() {
          let list = this.tasks;
          if(this.tab==='mine') list = list.filter(t=>t.assignee==='张工');
          if(this.tab==='today') list = list.filter(t=>t.assignee==='张工' && t.status!=='completed');
          if(this.filter.project) list = list.filter(t=>t.project===this.filter.project);
          if(this.filter.priority) list = list.filter(t=>t.priority===this.filter.priority);
          if(this.filter.assignee) list = list.filter(t=>t.assignee===this.filter.assignee);
          if(this.filter.status) list = list.filter(t=>t.status===this.filter.status);
          if(this.filter.keyword) list = list.filter(t=>t.title.includes(this.filter.keyword));
          return list;
        },
        get todayTasks() { return this.tasks.filter(t=>t.assignee==='张工' && t.status!=='completed'); },
        async init() {
          try {
            const [t, p, r] = await Promise.all([
              fetch('data/tasks.json').then(r=>r.json()),
              fetch('data/projects.json').then(r=>r.json()),
              fetch('data/requirements.json').then(r=>r.json())
            ]);
            this.tasks = t; this.projects = p; this.requirements = r;
          } catch(e) {}
        },
        viewDetail(t) { this.selectedTask = t; },
        toggleStatus(t) {
          t.status = t.status==='completed'?'in_progress':'completed';
          this.showToast(t.status==='completed'?'任务已完成':'任务已恢复');
        },
        createTask() {
          if(!this.newTask.title) { this.showToast('请输入任务名称','error'); return; }
          const id = 'T' + String(Date.now()).slice(-6);
          this.tasks.push({ id, ...this.newTask, actual:0 });
          this.showCreate = false;
          this.newTask = { title:'', requirement:'', assignee:'张工', start:'', end:'', estimate:0, priority:'P1', project:'P001', status:'pending', actual:0 };
          this.showToast('任务创建成功');
        },
        showToast(msg, type='success') {
          const id=++this._tid; this.toasts.push({id,msg,removing:false});
          setTimeout(()=>{const t=this.toasts.find(t=>t.id===id);if(t)t.removing=true;setTimeout(()=>this.toasts=this.toasts.filter(t=>t.id!==id),350);},2500);
        }
      };
    }
  </script>
</body>
</html>
