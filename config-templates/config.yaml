# Hermes ACP 默认配置
# 该文件会在首次启动时自动复制到 ~/.product-lobster/config.yaml
# 修改后需要重启应用生效
#
# 首启向导 / 设置页保存 API Key 时,会自动改写下面的 api_key、base_url、
# model.default 和 custom_providers[].models —— 换任意 OpenAI 兼容网关(360 /
# OpenAI 官方 / DeepSeek 官方 / 自建代理)都由向导填写,无需手动改本文件。

model:
  provider: custom
  default: deepseek/deepseek-v4.1-flash
  base_url: https://api.360.cn/v1
  # DeepSeek v4 系列真实上下文窗口是 1M。引擎 catalog 只精确认得 `deepseek-v4-flash`
  # (不带 .1),名字带 .1 时会退回通用兜底 `deepseek`=128k,白白砍掉 87% 窗口 ——
  # 长任务(原型生成)跑过 128k 就被压缩截断、"越到后面越忘前面"。这里显式钉死为 1M。
  # 换非 deepseek 模型做默认时,按该模型真实窗口调整或删除本行(让引擎自己探测)。
  context_length: 1000000

# 图片理解走的辅助 vision 模型。默认 provider:auto 会在 360 custom provider 下
# 解析出 360 不认识的 vision 模型名 → model_not_found → 图片请求失败。
# 显式钉死为 360 上真实存在的多模态模型（claude 自带 vision），走同一套鉴权。
auxiliary:
  vision:
    provider: custom
    model: anthropic/claude-sonnet-5
    timeout: 120
    download_timeout: 60

custom_providers:
  - name: "360ai"
    base_url: https://api.360.cn/v1
    # key_env: 兜底 —— 即便向导没能改写下面的 api_key,也会从 .env 的 OPENAI_API_KEY 读。
    key_env: OPENAI_API_KEY
    api_key: your-api-key-here
    # 顶栏下拉框可选模型(向导保存时会按所选网关收敛为实际填写的模型)。
    # 第一项 = 首启/向导保存 key 时写入的默认模型(model.default 跟随 models[0])。
    models:
      - deepseek/deepseek-v4.1-flash
      - deepseek/deepseek-v4-pro
      - anthropic/claude-opus-4.8
      - anthropic/claude-opus-5
      - anthropic/claude-sonnet-5
      - anthropic/claude-haiku-4.5
      - openai/gpt-5.5
      - moonshotai/kimi-k3
      - z-ai/glm-5.3
      - qwen/qwen3.8-max
      - minimax/MiniMax-M2.7-highspeed

providers:
  custom:
    stale_timeout_seconds: 300
fallback_providers: []

# 便携版没有可写的 site-packages,依赖的 lazy-install(联网 pip 装 boto3 等)永远失败。
# 关掉它,避免引擎每次会话初始化都联网重试、拖慢/卡死对话(主进程同时设了
# HERMES_DISABLE_LAZY_INSTALLS=1,双保险)。
security:
  allow_lazy_installs: false
