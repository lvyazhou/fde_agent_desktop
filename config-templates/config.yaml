# Hermes ACP 默认配置
# 该文件会在首次启动时自动复制到 ~/.product-lobster/config.yaml
# 修改后需要重启应用生效
#
# 首启向导 / 设置页保存 API Key 时,会自动改写下面的 api_key、base_url、
# model.default 和 custom_providers[].models —— 换任意 OpenAI 兼容网关(360 /
# OpenAI 官方 / DeepSeek 官方 / 自建代理)都由向导填写,无需手动改本文件。

model:
  provider: custom
  default: anthropic/claude-sonnet-5
  base_url: https://api.360.cn/v1

# 图片理解走的辅助 vision 模型。默认 provider:auto 会在 360 custom provider 下
# 解析出 360 不认识的 vision 模型名 → model_not_found → 图片请求失败。
# 显式钉死为 360 上真实存在的多模态模型（claude 自带 vision），走同一套鉴权。
auxiliary:
  vision:
    provider: custom
    model: anthropic/claude-sonnet-5
    timeout: 120
    download_timeout: 60

custom_providers:
  - name: "360ai"
    base_url: https://api.360.cn/v1
    # key_env: 兜底 —— 即便向导没能改写下面的 api_key,也会从 .env 的 OPENAI_API_KEY 读。
    key_env: OPENAI_API_KEY
    api_key: your-api-key-here
    # 顶栏下拉框可选模型(向导保存时会按所选网关收敛为实际填写的模型)。
    models:
      - anthropic/claude-opus-4.8
      - anthropic/claude-opus-5
      - anthropic/claude-sonnet-5
      - anthropic/claude-haiku-4.5
      - deepseek/deepseek-v4-pro
      - deepseek/deepseek-v4-flash
      - openai/gpt-5.5
      - openai/gpt-5.6-terra
      - moonshotai/kimi-k3
      - z-ai/glm-5.3
      - qwen/qwen3.8-max
      - minimax/MiniMax-M2.7-highspeed

providers: {}
fallback_providers: []
